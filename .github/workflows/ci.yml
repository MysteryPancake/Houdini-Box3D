# Checks every push and pull request: formatting, the docs checker, and the Houdini-free core
# (Box3D + b3dop_core + the core tests), with warnings as errors (GCC -Wall -Wextra on Linux,
# MSVC /W4 on Windows). The Houdini plugin needs an HDK install, so it is not built here.
name: CI

on:
  push:
  pull_request:

jobs:
  format-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: clang-format's output shifts slightly between versions. 19.1.5 is Visual Studio 2022's.
      - name: Install clang-format
        run: pip install clang-format==19.1.5
      - name: Check formatting
        run: |
          find src tests \( -name '*.cpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run -Werror --style=file
      - name: Check docs
        run: python tools/dev/check_docs.py

  python:
    # The Houdini checks import `hou`, so this runs them against a stand-in: registration, naming, pyflakes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - run: python -I tests/python/test_harness.py

  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            werror: "ON"
            double: "ON"
          - os: windows-latest
            werror: "ON"
            double: "ON"
          # Box3D in single precision: the core's position boundary must build and pass both ways.
          - os: ubuntu-latest
            werror: "ON"
            double: "OFF"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: >
          cmake -S . -B build -DBOX3DDOP_CORE_ONLY=ON -DBOX3DDOP_WARNINGS_AS_ERRORS=${{ matrix.werror }}
          -DBOX3DDOP_DOUBLE_PRECISION=${{ matrix.double }} -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel
      - name: Test
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure
      # Linux only (Makefiles write build/compile_commands.json). The Houdini-side files need an HDK.
      - name: clang-tidy
        if: matrix.os == 'ubuntu-latest' && matrix.double == 'ON'
        run: >
          clang-tidy -p build --warnings-as-errors='*'
          src/core/*.cpp tests/core_*.cpp tests/physics_*.cpp
